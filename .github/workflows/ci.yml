name: Continuous Integration

on:
  workflow_dispatch:
  merge_group:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# cancel previous runs if new commits are pushed into the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""

      - name: Download dependencies
        run: make deps

      - name: Build
        run: make build

      - name: Check the compiler is a static executable
        run: file target/release/lingua | tee /dev/stderr | grep -qE 'static(-pie)? linked'

      - name: Test
        run: make test

      - name: End-to-end
        run: make e2e

      - name: Build and check the Docker image
        run: |
          docker build -t lingua .
          docker run --rm -v "$PWD":/src -w /src lingua check tests/corpus/money.lf

  wasm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: wasm32-unknown-unknown
          rustflags: ""

      - name: Lint the wasm32 library
        run: cargo clippy --locked --target wasm32-unknown-unknown -p lingua --lib -p lingua-wasm -- -D warnings

      - name: Build the playground compiler
        run: cargo build --locked --release -p lingua-wasm --target wasm32-unknown-unknown

      - name: Check the wasm exports
        run: python3 wasm/check_exports.py target/wasm32-unknown-unknown/release/lingua_wasm.wasm

      - name: Upload the playground compiler
        uses: actions/upload-artifact@v7
        with:
          name: lingua-wasm
          path: target/wasm32-unknown-unknown/release/lingua_wasm.wasm
          if-no-files-found: error
