name: Check

on:
  workflow_dispatch:
  merge_group:
  pull_request:
    branches:
      - main

# cancel previous runs if new commits are pushed into the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""

      - name: Check formatting
        run: |
          make format
          git diff --exit-code -- .

      - name: Lint
        run: make check
